<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Deterministic publishing pipeline for engineering teams. Turn build facts into verified social content.">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;
             script-src 'self' 'unsafe-inline';
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
             font-src 'self' https://fonts.gstatic.com;
             connect-src 'self';
             img-src 'self' data:;">
  <title>ProofPost | Human-in-the-loop Publishing</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Core Styles -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/workspace.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <div id="app-shell" class="app-shell">

    <!-- Topbar -->
    <header class="topbar">
      <div class="flex items-center gap-4">
        <button id="sidebar-toggle" class="btn btn--ghost p-2" title="Toggle Sidebar" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="topbar__logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span class="logo-text">ProofPost <span class="badge badge--info ml-2 version-badge">V1.1.1</span></span>
        </div>
      </div>
      <div class="topbar__actions">
        <div class="flex items-center gap-4">
          <div class="flex items-center gap-2 px-3 py-1 bg-raised rounded-full border border-subtle" title="Currently Active AI Extraction Provider">
            <span class="text-xs">🧠</span>
            <span class="text-xs font-semibold mono text-brand uppercase" id="global-ai-status-text">AI: MOCK</span>
          </div>
          <div class="flex items-center gap-2 px-3 py-1 bg-raised rounded-full border border-subtle">
            <pp-status-dot id="global-status-dot" status="offline"></pp-status-dot>
            <span class="text-xs font-semibold mono" id="global-status-text">DISCONNECTED</span>
          </div>
          <button id="theme-toggle" class="btn btn--ghost p-2" title="Toggle Theme" aria-label="Toggle theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
      <nav class="nav-list">
        <a href="/dashboard" class="nav-item nav-item--active" data-route="/dashboard">
          <span class="nav-item__icon">📊</span>
          <span class="nav-item__label">Dashboard</span>
        </a>
        <a href="/workspace" class="nav-item" data-route="/workspace">
          <span class="nav-item__icon">🏗️</span>
          <span class="nav-item__label">Workspace</span>
        </a>
        <a href="/observability" class="nav-item" data-route="/observability">
          <span class="nav-item__icon">📡</span>
          <span class="nav-item__label">Observability</span>
        </a>
        <a href="/history" class="nav-item" data-route="/history">
          <span class="nav-item__icon">📜</span>
          <span class="nav-item__label">History</span>
        </a>
        <a href="/platforms" class="nav-item" data-route="/platforms">
          <span class="nav-item__icon">🌐</span>
          <span class="nav-item__label">Platforms</span>
        </a>
        <a href="/ai" class="nav-item" data-route="/ai">
          <span class="nav-item__icon">🧠</span>
          <span class="nav-item__label">AI Orchestration</span>
        </a>
        <div class="sidebar__nav-group">
          <a href="/settings" class="nav-item" data-route="/settings">
            <span class="nav-item__icon">⚙️</span>
            <span class="nav-item__label">Settings</span>
          </a>
          <a href="/docs" class="nav-item" data-route="/docs">
            <span class="nav-item__icon">📖</span>
            <span class="nav-item__label">Docs</span>
          </a>
        </div>
      </nav>

      <div class="sidebar__footer">
        <div class="sidebar-footer-text">SYSTEM OPERATOR CONSOLE</div>
      </div>
    </aside>

    <!-- Main Stage -->
    <main class="main-stage" id="view-container">
      <!-- Views injected here -->
      <div class="loading-state">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <!-- Boot -->
  <script type="module" src="app.js"></script>
</body>
</html>
